name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
        env:
          # The anon key is public by design, but it is still project-specific
          # config, so CI reads it from repository secrets rather than git.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Unit tests
        run: ./gradlew test --stacktrace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  database:
    name: Schema invariants (pgTAP)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client postgresql-15-pgtap

      - name: Create the auth schema Supabase provides
        # The migrations reference auth.users and auth.uid(). Locally we stub
        # them so the schema can be validated without a Supabase project.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            create schema if not exists auth;
            create table if not exists auth.users (id uuid primary key);
            create or replace function auth.uid() returns uuid
              language sql stable as \$\$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid \$\$;
            create role authenticated;
            create role anon;
          "
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Apply migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "--- $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Run schema invariants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/001_schema_invariants.sql
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
